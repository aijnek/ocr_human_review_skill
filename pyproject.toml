[project]
name = "ocr-human-review"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",                        # 日本語行は文字数≠表示幅で無意味。format に任せる
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode。全角スペース/コロンで大量誤検知
]
