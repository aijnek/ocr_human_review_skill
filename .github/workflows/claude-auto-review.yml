name: Claude Auto Review
on:
  pull_request:
    types: [opened, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この Pull Request を以下の観点でレビューしてください:
            - コード品質とベストプラクティス
            - 潜在的なバグや問題
            - セキュリティ上の影響
            - パフォーマンス上の考慮点

            注意: PR のブランチは既にカレントディレクトリにチェックアウト済みです。

            全体的なフィードバックには `gh pr comment` を使ってください。
            特定のコード箇所の指摘には `mcp__github_inline_comment__create_inline_comment`
            (`confirmed: true` を指定) を使ってください。
            レビュー内容は必ず GitHub のコメントとして投稿し、
            チャットのメッセージとしては出力しないでください。

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
