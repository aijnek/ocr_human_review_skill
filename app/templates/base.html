<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OCR Human Review{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">📄 OCR Human Review</a>
      <nav>
        <a href="/" class="{{ 'active' if page == 'index' else '' }}">受信箱</a>
        <a href="/admin" class="{{ 'active' if page == 'admin' else '' }}">管理</a>
      </nav>
      <button id="btn-shutdown" class="btn btn-ghost" title="エージェントのポーリングを終了します">セッション終了</button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
