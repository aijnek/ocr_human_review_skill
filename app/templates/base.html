<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OCR Human Review{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">📄 OCR Human Review</a>
      <nav>
        <a href="/" class="{{ 'active' if page == 'index' else '' }}">受信箱</a>
        <a href="/admin" class="{{ 'active' if page == 'admin' else '' }}">管理</a>
      </nav>
      <button id="btn-shutdown" class="btn btn-ghost" title="エージェントのポーリングを終了します">セッション終了</button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- チャットウィジェット -->
  <div id="chat-widget" class="chat-widget collapsed">
    <button id="chat-toggle" class="chat-toggle">💬 データについて質問</button>
    <div class="chat-panel">
      <div class="chat-header">保存データ Q&A</div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-pending" class="chat-pending" hidden>エージェントが回答中…</div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" type="text" placeholder="例: 確定済みの証明書は何件?" autocomplete="off">
        <button type="submit" class="btn btn-primary">送信</button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
